name: Deploy site and refresh fire data

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '20 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore last FIRMS retrievals
        uses: actions/cache/restore@v4
        with:
          path: assets/live/firms.json
          key: firms-retrievals-${{ github.run_id }}
          restore-keys: firms-retrievals-
      - name: Restore last fuel moisture retrievals
        uses: actions/cache/restore@v4
        with:
          path: assets/live/fuel-moisture.json
          key: fuel-moisture-${{ github.run_id }}
          restore-keys: fuel-moisture-
      - name: Restore last incident retrievals
        uses: actions/cache/restore@v4
        with:
          path: assets/live/incidents.json
          key: incidents-${{ github.run_id }}
          restore-keys: incidents-
      - name: Restore last AirNow PM2.5 retrievals
        uses: actions/cache/restore@v4
        with:
          path: assets/live/airnow-pm25.json
          key: airnow-pm25-${{ github.run_id }}
          restore-keys: airnow-pm25-
      - name: Restore last evacuation retrievals
        uses: actions/cache/restore@v4
        with:
          path: assets/live/evacuations.json
          key: evacuations-${{ github.run_id }}
          restore-keys: evacuations-
      - name: Restore last HRRR smoke run
        uses: actions/cache/restore@v4
        with:
          path: assets/live/hrrr-smoke
          key: hrrr-smoke-${{ github.run_id }}
          restore-keys: hrrr-smoke-
      - name: Restore last NOAA UV Index run
        uses: actions/cache/restore@v4
        with:
          path: assets/live/uvi
          key: noaa-uvi-${{ github.run_id }}
          restore-keys: noaa-uvi-
      - name: Refresh all non-smoke fire data
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        run: node scripts/fetch-live-data.mjs
      - name: Refresh FIRMS, incidents, and fire perimeters
        if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
        run: node scripts/fetch-live-data.mjs --skip-fuel-moisture
      - name: Confirm a smoke run is available for hourly deployment
        if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
        run: test -f assets/live/hrrr-smoke/manifest.json
      - name: Save FIRMS retrievals
        uses: actions/cache/save@v4
        with:
          path: assets/live/firms.json
          key: firms-retrievals-${{ github.run_id }}
      - name: Save fuel moisture retrievals
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        uses: actions/cache/save@v4
        with:
          path: assets/live/fuel-moisture.json
          key: fuel-moisture-${{ github.run_id }}
      - name: Save incident retrievals
        uses: actions/cache/save@v4
        with:
          path: assets/live/incidents.json
          key: incidents-${{ github.run_id }}
      - name: Save AirNow PM2.5 retrievals
        uses: actions/cache/save@v4
        with:
          path: assets/live/airnow-pm25.json
          key: airnow-pm25-${{ github.run_id }}
      - name: Save evacuation retrievals
        uses: actions/cache/save@v4
        with:
          path: assets/live/evacuations.json
          key: evacuations-${{ github.run_id }}
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        with:
          python-version: '3.12'
      - name: Install smoke dependencies
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        run: python -m pip install --disable-pip-version-check numpy pillow requests scipy eccodes
      - name: Refresh HRRR smoke
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        run: python scripts/fetch-hrrr-smoke.py
      - name: Refresh NOAA UV Index
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        run: python scripts/fetch-noaa-uvi.py
      - name: Save HRRR smoke run
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        uses: actions/cache/save@v4
        with:
          path: assets/live/hrrr-smoke
          key: hrrr-smoke-${{ github.run_id }}
      - name: Save NOAA UV Index run
        if: github.event_name != 'schedule' || github.event.schedule == '20 2,8,14,20 * * *'
        uses: actions/cache/save@v4
        with:
          path: assets/live/uvi
          key: noaa-uvi-${{ github.run_id }}
      - name: Write data refresh heartbeat
        run: node scripts/write-data-health.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
