name: Deploy site and refresh fire data

on:
  schedule:
    - cron: '20 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore last FIRMS retrievals
        uses: actions/cache/restore@v4
        with:
          path: assets/live/firms.json
          key: firms-retrievals-${{ github.run_id }}
          restore-keys: firms-retrievals-
      - run: node scripts/fetch-live-data.mjs
      - name: Save FIRMS retrievals
        uses: actions/cache/save@v4
        with:
          path: assets/live/firms.json
          key: firms-retrievals-${{ github.run_id }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pillow requests scipy eccodes
      - run: python scripts/fetch-hrrr-smoke.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
